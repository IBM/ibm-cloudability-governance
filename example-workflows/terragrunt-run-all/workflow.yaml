name: Workflow for terragrunt run-all deployments
run-name: Deployment Run
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
    - 'terragrunt/*'

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: ${{ github.run_id }}
      
      - name: Install Terragrunt and OpenTofu
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: '0.82.2'
          tofu_version: '1.10.1'

      - name: Run terragrunt plan
        run: |
          cd terragrunt
          terragrunt run-all plan \    
          --terragrunt-non-interactive \
          --terragrunt-parallelism 5 \
          --terragrunt-strict-include \
          --terragrunt-include-dir component-A \
          --terragrunt-include-dir component-B \
          -out tgplan.log

      - name: Upload tgplan as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgplan.log
          path: terragrunt/tgplan.log
  cloudability-governance:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
      contents: read
      checks: write
    strategy:
      matrix:
        components: [component-A, component-B]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: ${{ github.run_id }}
      
      - name: Install Terragrunt and OpenTofu
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: '0.82.2'
          tofu_version: '1.10.1'
      
      - name: Download plan output
        uses: actions/download-artifact@v4
        with:
          name: tgplan.log
          path: terragrunt/tgplan.log
      
      # only include one component dir to get the plan json for a single component
      - name: Convert plan output into json format each component
        run: |
          cd terragrunt
          terragrunt run-all show \    
          --terragrunt-non-interactive \
          --terragrunt-parallelism 5 \
          --terragrunt-strict-include \
          --terragrunt-include-dir ${{ matrix.components }} \
          --json tgplan.log > ${{ matrix.components }}/tfplan.json
      
      - name: Redact secrets from tfplan
        run: |
          cd terragrunt/${{ matrix.components }}
          sed -i 's/"password":"[^"]*"/"password":""/g' tfplan.json
          sed -i 's/"secret_string":"{[^}]*}"/"secret_string":""/g' tfplan.json

      - name: Get Frontdoor token
        uses: IBM/ibm-cloudability-governance/actions/frontdoor/login@v0.2.x
        with:
          fd-url: ${{ vars.FD_URL }}
          fd-public-key: ${{ secrets.FD_PUBLIC_KEY }}
          fd-secret-key: ${{ secrets.FD_SECRET_KEY }}

      - name: Get GitHub PR metadata
        uses: IBM/ibm-cloudability-governance/actions/github-info@v0.2.x
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Run Cloudability Governance Metadata Retrieval
        uses: IBM/ibm-cloudability-governance/actions/metadata@v0.2.x
        with:
          cloudability-host: ${{ vars.CLDY_HOST }}
          fd-env-id: ${{ vars.FD_ENV_ID }}
      
      - name: Run Cloudability Cost Estimation
        uses: IBM/ibm-cloudability-governance/actions/cost-estimation@v0.2.x
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          cloudability-host: ${{ vars.CLDY_HOST }}
          fd-env-id: ${{ vars.FD_ENV_ID }}
          deployment-name: ${{ matrix.components }}
          project-name: "The Project"
          provider-accounts: |
            {
              "*": {
                "account_id": "${{ secrets.SECOND_AWS_ACCOUNT_ID }}", 
                "vendor": "aws"
              }
            }
          tf-plan: "terragrunt/${{ matrix.components }}/tfplan.json"
          resource-usage: "terragrunt/${{ matrix.components }}/usage.json"

      - name: Run Cloudability Governance Policy Evaluation
        uses: IBM/ibm-cloudability-governance/actions/policy-evaluation@v0.2.x
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          cloudability-host: ${{ vars.CLDY_HOST }}
          fd-env-id: ${{ vars.FD_ENV_ID }}
          deployment-name: ${{ matrix.components }}
          project-name: "The Project"
          provider-accounts: |
            {
              "*": {
                "account_id": "${{ secrets.SECOND_AWS_ACCOUNT_ID }}", 
                "vendor": "aws"
              }
            }
          tf-plan: "terragrunt/${{ matrix.components }}/tfplan.json"
          resource-usage: "terragrunt/${{ matrix.components }}/usage.json"

      - name: Run Cloudability Recommendation
        uses: IBM/ibm-cloudability-governance/actions/recommendation@v0.2.x
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          cloudability-host: ${{ vars.CLDY_HOST }}
          fd-env-id: ${{ vars.FD_ENV_ID }}
          deployment-name: ${{ matrix.components }}
          project-name: "The Project"
          provider-accounts: |
            {
              "*": {
                "account_id": "${{ secrets.SECOND_AWS_ACCOUNT_ID }}", 
                "vendor": "aws"
              }
            }
          tf-plan: "terragrunt/${{ matrix.components }}/tfplan.json"
          resource-usage: "terragrunt/${{ matrix.components }}/usage.json"